name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ty check

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m claims

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not claims"

  paper:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, claims, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            paper:
              - 'paper/**'
              - '.github/workflows/ci.yml'
      - if: steps.filter.outputs.paper == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - if: steps.filter.outputs.paper == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest paper build
          files: paper/main.pdf
